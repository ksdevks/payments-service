name: payments

x-app: &app
  build: .
  image: payments:local
  restart: unless-stopped
  environment: &app-env
    API_KEY: ${API_KEY:?set API_KEY in .env}
    DATABASE_URL: postgresql+asyncpg://payments:payments@postgres:5432/payments
    RABBITMQ_URL: amqp://payments:payments@rabbitmq:5672/
    LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 3s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    # Данные RabbitMQ привязаны к имени ноды (rabbit@<hostname>). Без
    # фиксированного hostname пересозданный контейнер не увидит свой том.
    hostname: rabbitmq
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: payments
      RABBITMQ_DEFAULT_PASS: payments
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 24

  migrate:
    <<: *app
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    environment:
      <<: *app-env
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os, urllib.request;
          urllib.request.urlopen(urllib.request.Request(
          'http://127.0.0.1:8000/health/ready',
          headers={'X-API-Key': os.environ['API_KEY']}), timeout=2)
      interval: 5s
      timeout: 3s
      retries: 12

  relay:
    <<: *app
    command: ["payments-relay"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  consumer:
    <<: *app
    command: ["faststream", "run", "payments.entrypoints.consumer:build_app", "--factory"]
    environment:
      <<: *app-env
      GATEWAY_SUCCESS_RATE: ${GATEWAY_SUCCESS_RATE:-0.9}
      WEBHOOK_ALLOWED_HOSTS: ${WEBHOOK_ALLOWED_HOSTS:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  webhook-sink:
    <<: *app
    profiles: ["e2e"]
    command: ["python", "scripts/webhook_sink.py"]
    ports:
      - "9000:9000"
    environment: {}

volumes:
  postgres-data:
  rabbitmq-data:
