[project]
name = "payments"
version = "1.3.1"
description = "Asynchronous payment processing service"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13,<2",
    "asyncpg>=0.29,<1",
    "fastapi>=0.115,<1",
    "faststream[rabbit,cli]>=0.5.44,<0.6",
    "httpx>=0.27,<1",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.5,<3",
    "sqlalchemy[asyncio]>=2.0.35,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
payments-relay = "payments.entrypoints.relay:main"

[dependency-groups]
dev = [
    "mypy>=1.11,<2",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.7,<1",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "postgres: requires PostgreSQL (TEST_DATABASE_URL)",
    "rabbitmq: requires RabbitMQ (TEST_RABBITMQ_URL)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "RUF"]
# Комментарии и докстринги на русском: кириллица - не гомоглиф-атака.
# RUF001 (строковые литералы) оставляем включенным.
ignore = ["RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["payments"]

[[tool.mypy.overrides]]
module = ["faststream.*"]
# Декоратор subscriber у FastStream 0.5 не полностью типизирован.
disallow_untyped_decorators = false
